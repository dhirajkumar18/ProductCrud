spring.application.name=ProductCrud

# Cassandra connection
spring.cassandra.contact-points=172.30.37.96
spring.cassandra.port=9042
spring.cassandra.local-datacenter=datacenter1

# Keyspace
spring.cassandra.keyspace-name=products

# Schema management
spring.cassandra.schema-action=create_if_not_exists


# Logging (optional, for debugging)
logging.level.org.springframework.data.cassandra=DEBUG
logging.level.com.datastax.oss.driver=DEBUG
logging.file.path=logs/ 
logging.file.name=logs/application.log
